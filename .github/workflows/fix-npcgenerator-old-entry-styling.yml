name: Fix NPCGenerator old entry styling

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-npcgenerator-old-entry-styling.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NPCGenerator old entry styling
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          index_path = Path('NPCGenerator/index.html')
          index = index_path.read_text(encoding='utf-8')
          original_index = index

          index = replace_once(
              index,
              '          <label class="checkbox checkbox-inline">\n'
              '            <input type="checkbox" id="bestiary-show-old" />\n'
              '            <span data-i18n="bestiaryShowOldToggle">Show outdated entries?</span>\n'
              '          </label>',
              '          <label class="checkbox checkbox-inline bestiary-show-old-toggle" for="bestiary-show-old">\n'
              '            <input type="checkbox" id="bestiary-show-old" />\n'
              '            <span data-i18n="bestiaryShowOldToggle">Show outdated entries?</span>\n'
              '          </label>',
              'bestiary old checkbox label class',
          )

          index = replace_once(
              index,
              '      const shouldGrayBestiaryKey = (key, record) => {\n'
              '        if (!isOldBestiaryRecord(record)) return false;\n'
              '        const normalized = normalizeKey(key);\n'
              '        const allowed = new Set(["lp", "nazwa", "typ"]);\n'
              '        return allowed.has(normalized);\n'
              '      };',
              '      const shouldGrayBestiaryKey = (key, record) => {\n'
              '        if (!isOldBestiaryRecord(record)) return false;\n'
              '        const normalized = normalizeKey(key);\n'
              '        const allowed = new Set(["id", "lp", "state", "stan", "type", "typ", "name", "nazwa"]);\n'
              '        return allowed.has(normalized);\n'
              '      };\n\n'
              '      const updateBestiarySelectOldClass = (record) => {\n'
              '        bestiarySelect.classList.toggle("bestiary-select-old", Boolean(record && isOldBestiaryRecord(record)));\n'
              '      };',
              'old bestiary key set and select class helper',
          )

          index = replace_once(
              index,
              '        if (Number.isNaN(index)) {\n'
              '          state.selectedBestiaryIndex = null;\n'
              '          resetBestiaryOverrides();\n'
              '          renderBestiaryTable(null);\n'
              '          setArmorSelectionEnabled(true);\n'
              '          return;\n'
              '        }',
              '        if (Number.isNaN(index)) {\n'
              '          state.selectedBestiaryIndex = null;\n'
              '          resetBestiaryOverrides();\n'
              '          renderBestiaryTable(null);\n'
              '          updateBestiarySelectOldClass(null);\n'
              '          setArmorSelectionEnabled(true);\n'
              '          return;\n'
              '        }',
              'clear old select class when no bestiary selection',
          )

          index = replace_once(
              index,
              '        const record = state.bestiary[index];\n'
              '        renderBestiaryTable(record);\n'
              '        setArmorSelectionEnabled(!isBestiaryArmorBlocked(record));\n'
              '      };',
              '        const record = state.bestiary[index];\n'
              '        renderBestiaryTable(record);\n'
              '        updateBestiarySelectOldClass(record);\n'
              '        setArmorSelectionEnabled(!isBestiaryArmorBlocked(record));\n'
              '      };',
              'set old select class when bestiary selection changes',
          )

          index = replace_once(
              index,
              '          resetBestiaryOverrides();\n'
              '          renderBestiaryTable(null);\n'
              '          setArmorSelectionEnabled(true);\n'
              '        }\n'
              '      };\n\n'
              '      const splitEntries = (raw) => {',
              '          resetBestiaryOverrides();\n'
              '          renderBestiaryTable(null);\n'
              '          updateBestiarySelectOldClass(null);\n'
              '          setArmorSelectionEnabled(true);\n'
              '        } else {\n'
              '          updateBestiarySelectOldClass(selectedRecord);\n'
              '        }\n'
              '      };\n\n'
              '      const splitEntries = (raw) => {',
              'update old select class when old visibility changes',
          )

          index = replace_once(
              index,
              '          refreshBestiaryOptions();\n'
              '          bestiarySelect.selectedIndex = 0;\n'
              '          state.selectedBestiaryIndex = null;',
              '          refreshBestiaryOptions();\n'
              '          bestiarySelect.selectedIndex = 0;\n'
              '          state.selectedBestiaryIndex = null;\n'
              '          updateBestiarySelectOldClass(null);',
              'reset old select class',
          )

          if index != original_index:
              index_path.write_text(index, encoding='utf-8')

          style_path = Path('NPCGenerator/style.css')
          style = style_path.read_text(encoding='utf-8')
          original_style = style

          style = replace_once(
              style,
              'select,\n'
              'input[type="text"],\n'
              'textarea {\n'
              '  width: 100%;\n'
              '  padding: 10px 12px;\n'
              '  border-radius: 4px;\n'
              '  border: 1px solid var(--b2);\n'
              '  background: var(--bg);\n'
              '  color: var(--text);\n'
              '  font-family: inherit;\n'
              '}\n\n'
              '.input {',
              'select,\n'
              'input[type="text"],\n'
              'textarea {\n'
              '  width: 100%;\n'
              '  padding: 10px 12px;\n'
              '  border-radius: 4px;\n'
              '  border: 1px solid var(--b2);\n'
              '  background: var(--bg);\n'
              '  color: var(--text);\n'
              '  font-family: inherit;\n'
              '}\n\n'
              '#bestiary option {\n'
              '  color: var(--text);\n'
              '}\n\n'
              '#bestiary option.bestiary-option-old,\n'
              '#bestiary.bestiary-select-old {\n'
              '  color: var(--text-old);\n'
              '}\n\n'
              '.input {',
              'bestiary old select option styles',
          )

          style = replace_once(
              style,
              '.checkbox {\n'
              '  display: flex;\n'
              '  gap: 10px;\n'
              '  align-items: flex-start;\n'
              '}\n\n'
              '.checkbox input {',
              '.checkbox {\n'
              '  display: flex;\n'
              '  gap: 10px;\n'
              '  align-items: flex-start;\n'
              '}\n\n'
              '.bestiary-show-old-toggle {\n'
              '  margin-top: 10px;\n'
              '}\n\n'
              '.bestiary-show-old-toggle,\n'
              '.bestiary-show-old-toggle span {\n'
              '  color: var(--text-old);\n'
              '  opacity: 1;\n'
              '}\n\n'
              '#bestiary-show-old {\n'
              '  accent-color: var(--text-old);\n'
              '}\n\n'
              '.checkbox input {',
              'bestiary old checkbox styles',
          )

          if style != original_style:
              style_path.write_text(style, encoding='utf-8')

          workflow_path = Path('.github/workflows/fix-npcgenerator-old-entry-styling.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Match NPCGenerator old entry styling"
            git push
          fi
