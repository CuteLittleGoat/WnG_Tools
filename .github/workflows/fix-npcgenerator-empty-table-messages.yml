name: Fix NPCGenerator empty table messages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-npcgenerator-empty-table-messages.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NPCGenerator empty table messages
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('NPCGenerator/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '            traitDescriptionUnavailable: "Opis cechy nie jest dostępny w _meta.traits.",',
              '            traitDescriptionUnavailable: "Opis cechy nie jest dostępny w _meta.traits.",\n'
              '            emptyBestiary: "Wybierz rekord bestiariusza.",\n'
              '            emptyWeapon: "Wybierz broń, aby zobaczyć parametry.",\n'
              '            emptyArmor: "Wybierz pancerz, aby zobaczyć parametry.",\n'
              '            emptyAugmentations: "Wybierz augumentacje, aby zobaczyć parametry.",\n'
              '            emptyEquipment: "Wybierz ekwipunek, aby zobaczyć parametry.",\n'
              '            emptyTalents: "Wybierz talent, aby zobaczyć parametry.",\n'
              '            emptyPsionics: "Wybierz psionikę, aby zobaczyć parametry.",\n'
              '            emptyPrayers: "Wybierz modlitwę, aby zobaczyć parametry.",\n'
              '            clampExpand: "Kliknij aby rozwinąć",\n'
              '            clampCollapse: "Kliknij aby zwinąć",',
              'Polish empty table message keys',
          )

          replace_once(
              '            traitDescriptionUnavailable: "Trait description is unavailable in _meta.traits.",',
              '            traitDescriptionUnavailable: "Trait description is unavailable in _meta.traits.",\n'
              '            emptyBestiary: "Select a bestiary record.",\n'
              '            emptyWeapon: "Select a weapon to view its parameters.",\n'
              '            emptyArmor: "Select armor to view its parameters.",\n'
              '            emptyAugmentations: "Select augmentations to view their parameters.",\n'
              '            emptyEquipment: "Select equipment to view its parameters.",\n'
              '            emptyTalents: "Select a talent to view its parameters.",\n'
              '            emptyPsionics: "Select a psionic power to view its parameters.",\n'
              '            emptyPrayers: "Select a prayer to view its parameters.",\n'
              '            clampExpand: "Click to expand",\n'
              '            clampCollapse: "Click to collapse",',
              'English empty table message keys',
          )

          replace_once(
              '          hint.textContent = isExpanded ? "Kliknij aby zwinąć" : "Kliknij aby rozwinąć";',
              '          hint.textContent = isExpanded\n'
              '            ? translations[currentLanguage].messages.clampCollapse\n'
              '            : translations[currentLanguage].messages.clampExpand;',
              'clamp hint translation',
          )

          replacements = {
              'clearTableBody(bestiaryTableBody, "Wybierz rekord bestiariusza.", 2);':
                'clearTableBody(bestiaryTableBody, translations[currentLanguage].messages.emptyBestiary, 2);',
              'emptyMessage: "Wybierz broń, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyWeapon,',
              'emptyMessage: "Wybierz pancerz, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyArmor,',
              'emptyMessage: "Wybierz augumentacje, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyAugmentations,',
              'emptyMessage: "Wybierz ekwipunek, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyEquipment,',
              'emptyMessage: "Wybierz talent, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyTalents,',
              'emptyMessage: "Wybierz psionikę, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyPsionics,',
              'emptyMessage: "Wybierz modlitwę, aby zobaczyć parametry.",':
                'emptyMessage: translations[currentLanguage].messages.emptyPrayers,',
          }

          for old, new in replacements.items():
              replace_once(old, new, old)

          if text != original:
              path.write_text(text, encoding='utf-8')

          workflow_path = Path('.github/workflows/fix-npcgenerator-empty-table-messages.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix NPCGenerator empty table messages"
            git push
          fi
